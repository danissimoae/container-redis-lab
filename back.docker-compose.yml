services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - REDIS_URL=redis://redis-server:6379
      - APP_MESSAGE='Обновлено ! Количество посещений:'
      - SERVICE_NAME=web-architecture-lab2
    depends_on:
      redis-server:
        condition: service_healthy
    networks:
      - app-network

  redis-server:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network

networks:
  app-network:
    driver: bridge